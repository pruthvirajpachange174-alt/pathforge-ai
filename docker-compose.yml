version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pathforge-db
    restart: always
    environment:
      POSTGRES_USER: pathforge
      POSTGRES_PASSWORD: pathforge_pass
      POSTGRES_DB: pathforge_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  chroma:
    image: chromadb/chroma:latest
    container_name: pathforge-chroma
    restart: always
    ports:
      - '8000:8000'
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  postgres_data:
  chroma_data: