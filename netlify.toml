[build]
  # Install devDependencies even when NODE_ENV=production, since vite/tsc are needed to build.
  command = "pnpm install --prod=false && pnpm --filter pathforge-client build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
